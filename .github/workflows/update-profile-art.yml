name: Update profile art

# Refreshes contribution data, live repo stats, and animated SVG cards daily.
# Runs on a daily schedule, on pushes to main, and on manual dispatch.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape contribution data and fetch live profile stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render animated SVG cards
        run: python scripts/render_readme_cards.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile SVG cards [skip ci]"
          file_pattern: "data/contributions.json data/profile.json cards/*.svg"
